name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-test-format:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '24'
          cache: gradle

      - name: Gradle Wrapper ausfuehrbar machen
        run: chmod +x ./gradlew

      - name: Projekt bauen
        run: ./gradlew assemble

      - name: JUnit-Tests ausfuehren
        run: ./gradlew test

      - name: Formatierung pruefen
        run: ./gradlew spotlessCheck
